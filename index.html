<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PestView Pricing</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f2235,#17324d,#3aa6a6);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.container{
  text-align:center;
}

h1{
  margin-bottom:40px;
  font-size:32px;
}

.buttons{
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}

a{
  text-decoration:none;
}

.btn{
  background:white;
  color:#17324d;
  padding:20px 40px;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  transition:0.3s;
}

.btn:hover{
  background:#3aa6a6;
  color:white;
  transform:translateY(-3px);
}

/* Language switch */
.lang-switch{
  position:absolute;
  top:20px;
  right:20px;
}

.lang-switch button{
  background:white;
  border:none;
  padding:8px 12px;
  margin-left:5px;
  cursor:pointer;
  border-radius:6px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- LANGUAGE SWITCH -->
<div class="lang-switch">
  <button onclick="setLang('el')">GR</button>
  <button onclick="setLang('en')">EN</button>
</div>

<div class="container">

  <h1 id="title">Επιλογή Τιμοκαταλόγου</h1>

  <div class="buttons">
    <a href="old_price_list.index.html">
      <div class="btn" id="oldBtn">📄 Παλιός Τιμοκατάλογος</div>
    </a>

    <a href="new_price_list.index.html">
      <div class="btn" id="newBtn">🚀 Νέος Τιμοκατάλογος</div>
    </a>
  </div>

</div>

<script>
function setLang(lang){
  if(lang === 'en'){
    document.getElementById('title').innerText = "Select Pricing Plan";
    document.getElementById('oldBtn').innerText = "📄 Old Pricing";
    document.getElementById('newBtn').innerText = "🚀 New Pricing";
  } else {
    document.getElementById('title').innerText = "Επιλογή Τιμοκαταλόγου";
    document.getElementById('oldBtn').innerText = "📄 Παλιός Τιμοκατάλογος";
    document.getElementById('newBtn').innerText = "🚀 Νέος Τιμοκατάλογος";
  }
}
</script>

</body>
</html>
